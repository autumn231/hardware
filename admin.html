<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>管理后台 - 硬件分析师</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header class="header">
    <div class="header-inner">
      <div class="logo">
        <span class="logo-icon">⚡</span>
        <span class="logo-text">硬件分析师</span>
        <span class="logo-sub">管理后台</span>
      </div>
      <nav class="nav">
        <a href="/" class="nav-link">分析工具</a>
        <a href="/admin.html" class="nav-link active">管理后台</a>
      </nav>
    </div>
  </header>

  <main class="main">
    <section id="login-section" class="section">
      <div class="upload-card login-card">
        <div class="section-header">
          <h2>管理员登录</h2>
          <p>默认密码 admin123，首次登录后请立即修改</p>
        </div>
        <div class="form-group">
          <label for="password-input">密码</label>
          <input type="password" id="password-input" placeholder="请输入管理员密码" autocomplete="current-password">
        </div>
        <button class="btn btn-primary btn-large" id="login-btn">登录</button>
        <p class="form-error" id="login-error"></p>
      </div>
    </section>

    <section id="panel-section" class="section" style="display:none;">
      <div class="section-header">
        <h2>供应商配置</h2>
        <button class="btn btn-secondary" id="logout-btn">退出登录</button>
      </div>
      <p class="panel-note">分析请求会按下面的顺位依次尝试：第一家超时、报错或限流时自动切下一家。点「测试连接」会从边缘函数所在的位置探测该供应商，通不通以这个结果为准。</p>
      <div id="provider-list"></div>

      <div class="card settings-card">
        <div class="card-header">
          <span class="card-icon">🧭</span>
          <h3>调用顺位</h3>
        </div>
        <div class="card-body">
          <div id="order-list"></div>
        </div>
      </div>

      <div class="card settings-card">
        <div class="card-header">
          <span class="card-icon">🔧</span>
          <h3>通用设置</h3>
        </div>
        <div class="card-body">
          <div class="form-row">
            <div class="form-group">
              <label for="daily-limit-input">每日调用上限</label>
              <input type="number" id="daily-limit-input" min="1" max="100000">
            </div>
            <div class="form-group">
              <label for="access-code-input">分析访问口令（留空为不启用）</label>
              <input type="text" id="access-code-input" placeholder="启用后，用户分析时需输入此口令">
            </div>
          </div>
          <div class="form-group">
            <label for="new-password-input">修改管理员密码（留空为不修改）</label>
            <input type="password" id="new-password-input" placeholder="输入新密码" autocomplete="new-password">
          </div>
          <button class="btn btn-primary" id="save-btn">保存全部设置</button>
          <span class="save-status" id="save-status"></span>
        </div>
      </div>

      <div class="card settings-card">
        <div class="card-header">
          <span class="card-icon">📊</span>
          <h3>调用统计</h3>
        </div>
        <div class="card-body">
          <div class="info-grid">
            <div class="info-item"><span class="info-label">今日调用</span><span class="info-value" id="stat-today">-</span></div>
            <div class="info-item"><span class="info-label">累计调用</span><span class="info-value" id="stat-total">-</span></div>
            <div class="info-item"><span class="info-label">每日上限</span><span class="info-value" id="stat-limit">-</span></div>
          </div>
          <button class="btn btn-secondary" id="reset-stats-btn">重置统计</button>
          <button class="btn btn-secondary" id="refresh-stats-btn">刷新</button>
        </div>
      </div>
    </section>
  </main>

  <footer class="footer">
    <p>硬件分析师 &copy; 2026 | 基于 EdgeOne Pages + 多模型 API 构建</p>
  </footer>

  <script src="/js/admin.js"></script>
</body>
</html>
